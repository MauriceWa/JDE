<section class="tournaments-container">
  <header>
    <h1 class="title-3d">Tournaments</h1>
    <p class="subtitle">Join our upcoming events and show your skills on the Rift.</p>
  </header>

  <div class="tournament-list">
    <div class="list-header" aria-hidden="true">
      <span class="col-status">Status</span>
      <span class="col-info">Tournament</span>
      <span class="col-date">Date</span>
      <span class="col-prize">Prize Pool</span>
      <span class="col-action"></span>
    </div>

    <div *ngFor="let tournament of tournaments" class="tournament-row" [class.completed]="tournament.status === 'Completed'">
      <div class="col-status">
        <span class="status-badge" [class.badge-upcoming]="tournament.status === 'Upcoming'">
          {{ tournament.status }}
        </span>
      </div>

      <div class="col-info">
        <h3>{{ tournament.name }}</h3>
        <p>{{ tournament.description }}</p>
      </div>

      <div class="col-date">
        <span class="label-mobile">Date:</span>
        {{ tournament.date }}
      </div>

      <div class="col-prize">
        <span class="label-mobile">Prize:</span>
        <span class="icon" aria-hidden="true">🏆</span> {{ tournament.prizepool }}
      </div>

      <div class="col-action">
        <a *ngIf="tournament.status !== 'Completed'" [href]="tournament.link" target="_blank" class="btn-action">
          Register
        </a>
        <span *ngIf="tournament.status === 'Completed'" class="status-text">Registration Closed</span>
      </div>
    </div>
  </div>
</section>
